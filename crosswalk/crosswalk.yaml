dha_schedule_policy_career_note: >
  Deliberately excluded from this crosswalk. As of mid-2026, OPM's implementation
  targets ~8,000 positions government-wide, ~97% of them at or above GS-15, following
  the EO signed June 2026. Designation is a reclassification of an existing
  incumbent's position, not typically a new-hire action -- so it should generate
  little to no accession volume regardless of eventual scale. Not worth a
  position-list join against accessions data at this time; revisit if that changes.

dha_notes_on_preference_under_dha: >
  Both the 2018 and 2024 STEM/cyber memos state explicitly: "Qualified candidates
  with veterans' preference should be selected as they are found, just as any
  qualified non-preference eligible candidate would be." DHA removes RANKING
  (points, rule of three, order-of-merit certificates) and requires applicants be
  worked roughly in order of receipt -- it does not instruct agencies to
  deprioritize or exclude preference eligibles. A high DHA-eligible share of a
  bucket is evidence the RANKING mechanism could have been bypassed, not evidence
  that veterans were disadvantaged by it. Low veteran shares in DHA-eligible series
  (e.g., 1550, 0801, 1301) are better explained by applicant-pool composition (see
  the regimes section's notes on credential gates and military feeders) than by
  DHA itself suppressing veteran hiring.
