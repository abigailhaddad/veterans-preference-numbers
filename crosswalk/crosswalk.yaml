      Agency-specific direct-hire authorities (as distinct from government-wide).
      These are the majority of actual DHA usage and are not on the government-wide
      listing page at all -- each is its own Federal Register notice or CHCO memo,
      scoped to one agency + series + grade + date range. VA, DHS/CBP, SSA, and IRS
      are large enough employers in this dataset that agency-specific grants there
      could matter more in volume than everything in this file combined. Not
      researched in this pass. Also unresearched: ~19 of DoD's ~20 other
      NDAA-derived DHAs beyond Z5CL (named leads found but not verified: NDAA FY16
      Sec. 1112/1113 for technical acquisition positions, NDAA FY17 Sec. 1110 as
      amended by FY18 Sec. 1106 for financial management experts), and DoD
      Laboratory Demonstration Project DHA (Public Law 103-337) -- see
