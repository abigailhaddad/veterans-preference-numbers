# Veterans'-preference crosswalk for OPM/EHRI accessions records.
#
# ONE file, two sections, read together by apply_crosswalk.py:
#   `regimes`        - classifies each accession by which legal regime governed
#                       veterans'-preference applicability for that hiring action
#   `dha_authorities` - a separate, cross-cutting dimension: which government-wide
#                       or DoD-specific direct-hire authorities the record's
#                       series+grade+date+agency is ELIGIBLE under (not USED under
#                       -- DHA eligibility leaves no trace in service type, pay
#                       plan, or appointment type, so it has to be reconstructed
#                       from primary-sourced authority grants instead of read off
#                       a field). apply_crosswalk.py joins both onto every record
#                       and produces one final "veterans_preference" verdict column:
#                       Yes / Ambiguous (DHA-eligible) / Limited / No / Unknown.
#
# Classification uses ONLY fields present in the public impactproject/opm-ehri-data
# accessions parquet (agency, agency_code, agency_subelement, occupational_series_code,
# grade, position_occupied, appointment_type, pay_plan_code, pathways_group,
# personnel_action_effective_date_yyyymm, veteran_indicator, count). No legal-
# authority / nature-of-action code is published in that dataset, so most of this
# crosswalk is inference from appointment mechanics, not a direct read of "which
# statute applied." See `known_gaps` below before trusting any single bucket's
# veteran share as a causal statement about preference.
#
# CITATIONS: every regime/authority entry carries a `sources:` list --
# {cite, url, verified} -- instead of a bare citation string. `verified` records
# HOW the citation was checked, not just that a claim was made:
#   primary_text_read   - the actual statute/regulation/memo text was fetched and
#                         read directly (quoted verbatim in `notes` where relevant)
#   primary_doc_quoted_in_secondary - not fetched directly, but read verbatim as
#                         quoted inside another primary document (e.g. NDAA section
#                         numbers as cited inside the VA OCHCO bulletin PDF)
#   search_summary_only  - sourced from an AI-generated web-search summary, never
#                         independently re-read against the primary text. Treat
#                         these as the weakest tier in the file; the citation is
#                         probably right but has not been checked the way the
#                         primary_text_read entries have.
#   unverified            - a plausible extrapolation (e.g. assuming three parallel
#                         academy pay statutes behave alike after verifying only
#                         one) that was not itself checked.
#
# ACCURACY FLOOR: 2010-01. Confirmed via DESCRIBE across sample accessions
# months, 2005-2024 (2026-08-07): pre-2010 files have 33 columns; 2010-01
# jumps to 65+. veteran_indicator AND position_occupied both first appear at
# 2010-01 -- not just veteran_indicator. position_occupied is the field nearly
# every regime predicate below keys off (COMPETITIVE SERVICE / EXCEPTED
# SERVICE), so pre-2010 records don't get misclassified, they silently
# collapse into "Unknown" as every position_occupied-gated WHEN clause
# evaluates NULL. apply_crosswalk.py enforces this floor by clamping --start.
# Smaller, lower-stakes gap: pathways_group doesn't appear until ~2015, so
# pathways_other's `pathways_group IS NOT NULL` branch can't fire 2010-2014
# (its `SCHEDULE D` appointment_type branch can still catch some). Within
# 2010-present, the only regime-specific date gates needed are already applied
# below: dod_ces_inferred (eligible_from 2017-08) and va_title38_hybrid_viper
# (eligible_from 2022-12) -- every other cited authority predates 2005.
#
# Rule evaluation order for `regimes` = list order below. First matching rule wins
# (like SQL CASE). Rule evaluation order for `dha_authorities.*.covered_series` is
# handled in apply_crosswalk.py: unconditional grants are checked before conditional
# ones, since several series (2210, 1550, 0854, 1811, 0343) are covered by more than
# one authority with different conditionality -- see that script's docstring.
#
# confidence (regimes):
#   confirmed - the field combination is at or near definitional for the authority
#   inferred  - a named, argued hypothesis; not verified against a legal-authority code
#   residual  - a catch-all; may contain any authority not otherwise flagged
#   NOTE: `confidence` grades the SQL DETECTION rule (does this predicate correctly
#   identify records under this authority), which is a SEPARATE question from
#   `sources.*.verified` (was the underlying legal claim itself checked against
#   primary text). A `confirmed` detection rule can still cite a `search_summary_only`
#   source -- read both fields before trusting an entry.
#
# preference_status (regimes):
#   outside_title5          - appointed under a statute other than title 5; 5 USC
#                             3309-3318 (mechanical preference) do not apply by their
#                             terms
#   exempt_from_302         - excepted service, exempt from 5 CFR 302 appointment
#                             procedures under 302.101(c); preference survives only as
#                             "a positive factor... as far as administratively feasible"
#                             -- the closing sentence of 5 CFR 302.101(c) itself (see
#                             attorney_302_exemption entry for the verified text).
#                             5 USC 3320 is a related but separate provision: it
#                             requires excepted-service selection to mirror the same
#                             procedures required for the competitive service by
#                             3308-3318, for any excepted position not otherwise
#                             exempted under 302.101(c) -- i.e. 3320 is why ordinary
#                             excepted hiring still gets preference procedures, and
#                             302.101(c) is the list of what's carved OUT of that.
#   not_preference_eligible - person-level exclusion from "preference eligible" under
#                             5 USC 2108(3)/(4), independent of the appointment channel
#   applies_full             - ordinary 5 USC 3309-3318 mechanical preference applies,
#                             AS FAR AS THIS DATASET CAN TELL (see dha_blind_spot below;
#                             apply_crosswalk.py further splits this into "Yes" vs
#                             "Ambiguous (DHA-eligible)" using dha_authorities)
#   unknown                  - cannot be determined from available fields

metadata:
  source_dataset: impactproject/opm-ehri-data (accessions)
  fields_used:
    - agency
    - agency_code
    - agency_subelement
    - occupational_series_code
    - grade
    - position_occupied
    - appointment_type
    - pay_plan_code
    - pathways_group
  validated_window: "202401-202412"
  validated_coverage:
    confirmed_pct: 23.3
    inferred_pct: 6.7
    residual_pct: 69.9
    note: >
      Coverage measured against 273,730 accessions, CY2024, on the `regimes`
      classification alone (before folding in dha_authorities). Once
      dha_authorities is folded in via apply_crosswalk.py's combined verdict
      column, 10.2% of all accessions and 18.4% of veteran hires land in
      "Ambiguous (DHA-eligible)" rather than a clean Yes/No. See known_gaps for
      what's still not covered.
  citation_pass_note: >
    Every citation in this file was fetched and read directly (see `sources` on
    each entry; `verified: primary_text_read`), not taken from a search
    summary, EXCEPT where marked `search_summary_only` or `unverified` --
    those are flagged rather than silently treated as equivalent to the rest.
    Two notes on provisions that are easy to get wrong: 5 USC 3320 does NOT
    contain the "positive factor... as far as administratively feasible"
    language cited throughout this file for exempt_from_302 -- that quote is
    the closing sentence of 5 CFR 302.101(c) itself. 3320 instead requires
    excepted-service selection to mirror 3308-3318 procedures except where
    302.101(c) exempts a position. And VRA is a COMPETITIVE-SERVICE
    appointment authority under 5 CFR 307.101 ("to positions in the
    competitive service... without regard to the competitive examining
    system"), not a Schedule B one -- VRA hires most likely sit inside the
    ordinary competitive-service buckets, not Schedule B; see
    schedule_b_unknown_subtype and known_gaps.vra_veoa_blind_spot. Graves v. VA (117
    M.S.P.R. 697 (2012)) has no located public URL for the decision itself and
    is cited without one rather than with a guessed link.

known_gaps:
  - id: dha_blind_spot
    description: >
      Direct-hire authority (5 USC 3304(a)(3); 5 CFR 337.201-337.202) waives 5 USC
      3309-3318 (the entire mechanical preference apparatus: points, ranking, rule of
      three) WITHOUT changing service type, pay plan, or appointment-type coding. A DHA
      hire is recorded identically to an ordinary competitive GS/GG permanent hire.
      There is no way to distinguish ELIGIBLE-AND-USED from ELIGIBLE-AND-NOT-USED in
      this dataset. PARTIALLY BOUNDED (not closed) by this file's `dha_authorities`
      section, which encodes seven confirmed authorities (six government-wide,
      GW-001/002/006/007/008/009, plus one DoD-specific, Z5CL) by series+grade+date
      (+agency, for Z5CL), sourced from primary CHCO/OSD memos and OPM's live DHA
      listing page. Run against CY2024: 10.2% of all accessions and 18.4% of veteran
      hires fall in a DHA-ELIGIBLE series/grade/date cell -- this is a real ceiling on
      "applies_full," not a guess, but it is NOT usage, and it does not cover
      agency-specific DHAs (see dha_not_covered_here below), which are most of actual
      DHA usage government-wide and remain unresearched. Notably, DHA-eligible cells
      skew HIGHER veteran share than the accession baseline (every source memo
      instructs agencies to select preference eligibles as found, not to deprioritize
      them) -- eligibility is not evidence of veteran exclusion.
  - id: vra_veoa_blind_spot
    description: >
      Veterans Recruitment Appointment and Veterans Employment Opportunities Act
      access (opens closed merit-promotion announcements to preference eligibles)
      are both veteran-specific hiring mechanisms with no confirmed,
      distinguishable field value in this dataset. OPM's FY2024 DVAAP report
      (Employment of Veterans and Military-Connected Spouses and Survivors in the
      Federal Executive Branch, Jan 2026) counts these centrally: 2,981 VRA hires
      and 8,625 VEOA hires government-wide in FY2024 -- proving OPM has a
      legal-authority-level field that is simply not published in the accessions
      API.

      VRA is a COMPETITIVE-SERVICE appointment authority, not a Schedule B one.
      5 CFR 307.101: "This part implements 38 U.S.C. 4214 and Executive Order
      11521, which authorizes agencies to appoint qualified covered veterans
      to positions in the competitive service under Veterans Recruitment
      Appointments (VRAs) without regard to the competitive examining system."
      VRA hires are therefore most likely sitting inside this crosswalk's
      ordinary "Ordinary competitive GS/GG, permanent" or "Competitive
      service, nonpermanent or other pay plan" buckets -- recorded as
      COMPETITIVE_SERVICE, appointment_type "OTHER" or similar -- not inside
      Schedule B (which is excepted service). The VRA blind spot lives inside
      those two large competitive-service buckets, which makes it a
      consequential one: those buckets are the largest in the file and their
      "applies_full" verdict already carries the separate DHA blind spot too.
    sources:
      - {cite: "38 U.S.C. 4214", url: "https://www.law.cornell.edu/uscode/text/38/4214", verified: primary_text_read}
      - {cite: "5 CFR 307.101 (VRA implementing regulation -- competitive service, not Schedule B)",
         url: "https://www.law.cornell.edu/cfr/text/5/307.101", verified: primary_text_read}
  - id: schedule_a_subtype_blind_spot
    description: >
      Schedule A (5 CFR 213.3102) covers disability appointments (213.3102(u)),
      attorney appointments (213.3102(d) -- see attorney_302_exemption, which
      does not rely on Schedule A detection because 302.101(c)(8) exempts
      attorney positions by name regardless of schedule), academy-adjacent
      appointments, law clerk trainee positions (213.3102(e)), a DOJ witness-
      program-adjacent authority (213.3102(gg), Public Law 91-452), and many
      agency-specific OPM-approved authorities under 302.101(c)(6) -- which
      additionally requires a SEPARATE OPM written concurrence before part 302
      procedures are actually waived, that this dataset cannot observe. All of
      these collapse into one appointment_type value and cannot be subtyped
      here. VERIFIED DIRECTLY (2026-08-06): 213.3102(d) is a single-line
      paragraph, "Attorneys.", confirming this crosswalk's longstanding
      assumption that attorneys' Schedule A basis lives there; 213.3102(u) is
      "Appointment of persons with intellectual disabilities, severe physical
      disabilities, or psychiatric disabilities," multi-part, requiring
      documented proof of disability.
    sources:
      - {cite: "5 CFR 213.3102", url: "https://www.law.cornell.edu/cfr/text/5/213.3102", verified: primary_text_read}
      - {cite: "5 CFR 213.3102(d) (Attorneys)", url: "https://www.law.cornell.edu/cfr/text/5/213.3102", verified: primary_text_read}
      - {cite: "5 CFR 213.3102(u) (disability appointments)", url: "https://www.law.cornell.edu/cfr/text/5/213.3102", verified: primary_text_read}
  - id: disability_veteran_status_conflation
    description: >
      OPM's disabled-veteran hiring figures (Schedule A 213.3102(u), VRA, VEOA) are
      about DISABILITY and/or VETERAN status of the person, not about a distinct
      preference regime. Do not conflate "hired via a veteran-specific noncompetitive
      channel" (a preference DELIVERY mechanism) with "exempt from preference" (VA
      title 38, attorneys, SES) -- they are opposite in intent. This crosswalk keeps
      them as separate buckets; downstream analysis should not merge them.
  - id: military_spouse_authority_is_not_veterans_preference
    description: >
      Military-spouse noncompetitive hiring authorities are a SEPARATE statutory
      basis from veterans' preference, AND explicitly preference-inapplicable, not
      merely unrelated -- confirmed via VA/OCHCO Bulletin, "Military Spouse Hiring
      Authorities" (amended 2024-03-12), covering EO 13473, EO 12721, and EO 13832
      (see sources below for each). Quoted directly from the bulletin: "Veterans'
      preference requirements do not apply when filling a job under this authority."
      SF-50 codes exist (authority LAM/315.612 permanent, LDM/316.302(b)(3)MS term,
      LCM/316.402(b)(3)MS temporary, ZJK/5 CFR 315.608 for EO 12721) but are
      candidate-side (depends on the APPLICANT being a military spouse/family
      member, not on the position) and, like VRA/VEOA, have no corresponding field
      in public accessions data -- structurally uncodable here regardless of
      research effort, not merely unresearched.
    sources:
      - {cite: "VA OCHCO Bulletin, \"Military Spouse Hiring Authorities\" (amended 2024-03-12)",
         url: "https://www.vaforvets.va.gov/vaforvets/docs/OCHCO-bulletin-20240312-03.pdf",
         verified: primary_text_read}
      - {cite: "EO 13473 (2008, noncompetitive appointment of certain military spouses)",
         url: "https://www.govinfo.gov/content/pkg/FR-2008-09-30/pdf/E8-23125.pdf",
         verified: primary_doc_quoted_in_secondary}
      - {cite: "5 U.S.C. 3330(d) (codifying EO 13473, via NDAA FY2013 Sec. 566(a), P.L. 112-239)",
         url: "https://www.congress.gov/112/plaws/publ239/PLAW-112publ239.pdf",
         verified: primary_doc_quoted_in_secondary}
      - {cite: "NDAA FY2023 Sec. 1111, P.L. 117-263 (extends eligibility through 2028-12-31)",
         url: "https://www.congress.gov/bill/117th-congress/house-bill/7776/text",
         verified: primary_doc_quoted_in_secondary}
      - {cite: "EO 12721 (1990, returning overseas family members), 5 CFR 315.608",
         url: "https://www.govinfo.gov/content/pkg/CFR-2011-title5-vol1/pdf/CFR-2011-title5-vol1-sec315-608.pdf",
         verified: primary_doc_quoted_in_secondary}
      - {cite: "EO 13832 (2018, outreach/advertising requirements)",
         url: "https://www.govinfo.gov/content/pkg/FR-2018-05-14/pdf/2018-10403.pdf",
         verified: primary_doc_quoted_in_secondary}
  - id: dha_true_scale_likely_much_larger_than_measured
    description: >
      MSPB's Feb 2021 research brief (Direct-Hire Authority Under 5 U.S.C. Sec
      3304: Usage and Outcomes) reports DHA of all types reached ~27% of ALL
      competitive-service hires by FY2018 and was still rising. It splits ALL DHA
      appointments FY2014-2018 into three legal-authority families: Sec 3304 DHA
      (government-wide + agency-specific under 5 USC 3304(a)(3)) = 39%; DoD-
      specific DHA under various NDAAs (DoD officials cited "over 20 different
      DHAs in the last 10 years or so") = 47%; DoD Laboratory Demonstration
      Project DHA (Public Law 103-337, May 1996) = 14%. This file's
      `dha_authorities` covers the government-wide slice of the FIRST category in
      full, plus exactly ONE instance of the second (Z5CL) -- most of DoD's ~20
      other NDAA-derived authorities, and all of the lab-demo-project category,
      remain unresearched. Agency-specific Sec 3304 grants (VA, DHS, and DoD are
      named by MSPB as the three largest Sec 3304 DHA users, tracking their
      overall hiring volume) are also entirely unresearched. The measured 10.2%
      DHA-eligible / 18.4% of veteran hires (CY2024, seven authorities) should be
      read as a documented FLOOR from named, dated, primary-sourced authorities --
      not an estimate of true DHA scale, which is almost certainly still larger.
      OPM's internal legal-authority code families for this: AYM (Sec 3304,
      government-wide or agency-specific, with secondary code BYO for any
      agency-specific grant), and Z5C ("DIRECT-HIRE AUTHORITY" umbrella code
      cited by MSPB for DoD lab-demo DHA) -- neither published in the public
      accessions parquet. Other named-but-unresearched DoD DHAs found in this
      research pass (not yet added as dha_authorities entries): NDAA FY16 Sec.
      1112/1113 (technical acquisition positions), NDAA FY17 Sec. 1110 as amended
      by FY18 Sec. 1106 (financial management experts).
    sources:
      - {cite: "MSPB, \"Direct-Hire Authority Under 5 U.S.C. Sec 3304: Usage and Outcomes\" (Feb 2021)",
         url: "https://www.mspb.gov/studies/researchbriefs/Direct_Hire_Authority_Under_5_USC_%C2%A7_3304_Usage_and_Outcomes_1803830.pdf",
         verified: primary_text_read}

regimes:
  - id: national_guard_dual_status_technician
    label: "National Guard dual-status military technician (32 USC 709)"
    plain_label: "National Guard dual-status technicians"
    confidence: inferred  # agency-level detection can't distinguish 32 USC 709 employees from other Guard-unit civilian staff
    legal_basis: "32 U.S.C. 709(g)(1)"
    sources:
      - {cite: "32 U.S.C. 709(g)(1)-(2)", url: "https://www.law.cornell.edu/uscode/text/32/709", verified: primary_text_read}
      - {cite: "32 U.S.C. 709(b)-(e) (dual-status default, non-dual-status exception, competitive-service scope)",
         url: "https://www.law.cornell.edu/uscode/text/32/709", verified: primary_text_read}
    preference_status: not_preference_eligible  # CONFIRMED at the statute level; see note for what remains uncertain
    notes: >
      Resolves an anomaly noted earlier in this project: Air/Army National Guard
      Units accessions run far below the government-wide veteran baseline despite
      every incumbent plausibly being a current servicemember.

      32 USC 709(g)(1) reads "Except as provided in subsection (f), sections
      2108, 3502, 7511, and 7512 of title 5 do not apply to a person employed
      under this section." 5 USC 2108 is the statute that defines "preference
      eligible" -- so Congress made the entire veterans'-preference eligibility
      framework inapplicable to persons employed under section 709.

      This covers more than just dual-status (DS) technicians. Section 709
      distinguishes DS (must maintain Guard membership per subsection (b), the
      default) from non-dual-status (NDS, an exception under subsection (c),
      capped per 10 USC 10217(c)(2)). Subsection (e)'s "outside the competitive
      service" exclusion IS explicitly scoped to positions "required under
      subsection (b)" (DS only) -- but subsection (g)(1)'s exclusion of section
      2108 has no such qualifier; it applies broadly to "a person employed
      under this section." Since NDS technicians are the statutorily-capped
      minority exception rather than the default, (g)(1) most plausibly
      excludes both DS and NDS technicians from preference eligibility. The
      remaining uncertainty is in the DETECTION rule below (agency_subelement
      LIKE '%NATIONAL GUARD%'), which cannot confirm a hire is actually
      "employed under this section" at all, vs. e.g. ordinary title-5 civilian
      staff who happen to work at a Guard unit -- not in the underlying legal
      exclusion, which the statute states plainly.

      Separately: current Guard members are typically NOT coded as "veteran" in
      veteran_indicator (that field means separated/discharged service), so this
      population's low observed veteran share is partly a DEFINITIONAL artifact,
      not purely a preference-exclusion effect -- two distinct things pointing
      the same direction.
    sql_predicate: >
      agency_subelement LIKE '%NATIONAL GUARD%'
      AND position_occupied = 'EXCEPTED SERVICE'

  - id: va_title38_pure
    label: "VA pure title 38 (38 USC 7401(1))"
    plain_label: "VA doctors, dentists, and nurses"
    confidence: confirmed
    legal_basis: "38 U.S.C. 7401(1)"
    sources:
      - {cite: "38 U.S.C. 7401(1)", url: "https://www.law.cornell.edu/uscode/text/38/7401", verified: primary_text_read}
    preference_status: outside_title5
    notes: >
      Physicians, dentists, podiatrists, chiropractors, optometrists, RNs, PAs at VA.
      Appointed outside title 5 entirely; title 5 preference procedures do not apply
      by their terms. Detection matches on title-38 pay-plan codes (VM/VN/VP/VC/
      VH/VF) OR on agency+series+excepted-service alone, since VA pay-plan coding
      for these series is not fully consistent -- some VA 0602/0610 hires are
      recorded on ordinary GS pay codes while still excepted-service, and those
      are still almost certainly 7401(1) appointees. That agency+series+excepted
      fallback is an UNVERIFIED assumption about VA's internal coding practice,
      not something
      independently confirmed against a VA source document.
    sql_predicate: >
      substr(agency_code,1,2)='VA'
      AND (
        pay_plan_code IN ('VM','VN','VP','VC','VH','VF')
        OR (
          occupational_series_code IN ('0602','0680','0668','0662','0610','0603')
          AND position_occupied='EXCEPTED SERVICE'
        )
      )

  - id: va_title38_hybrid_core
    label: "VA hybrid title 38 (38 USC 7401(3))"
    plain_label: "VA medical staff"
    confidence: confirmed
    legal_basis: "38 U.S.C. 7401(3); Graves v. VA, 117 M.S.P.R. 697 (2012); VA Handbook 5005"
    sources:
      - {cite: "38 U.S.C. 7401(3), current text", url: "https://www.law.cornell.edu/uscode/text/38/7401", verified: primary_text_read}
      - {cite: "Graves v. VA, 117 M.S.P.R. 697 (2012)", url: null,
         verified: search_summary_only, note: "Case citation; no verified public URL located in this research pass."}
    preference_status: exempt_from_302
    notes: >
      Psychologists, pharmacists, speech pathologists/audiologists, dietitians,
      occupational therapists, social workers, biomedical engineers, practical/
      vocational nurses, nurse assistants, diagnostic radiologic technologists,
      and medical technologists. Excepted from 5 CFR 302 appointment procedures,
      but Graves holds VA must still apply title 5 veterans' preference
      substantively.

      Full current 38 USC 7401(3) text: "Audiologists, licensed hearing aid
      specialists, speech pathologists, and audiologist-speech pathologists,
      biomedical engineers, certified or registered respiratory therapists,
      dietitians, licensed physical therapists, licensed practical or
      vocational nurses, nurse assistants, medical instrument technicians,
      medical records administrators or specialists, medical records
      technicians, medical technologists, dental hygienists, dental assistants,
      nuclear medicine technologists, occupational therapists, occupational
      therapy assistants, kinesiotherapists, orthotist-prosthetists,
      pharmacists, pharmacy technicians, physical therapy assistants,
      prosthetic representatives, psychologists, diagnostic radiologic
      technologists, therapeutic radiologic technologists, social workers,
      marriage and family therapists, licensed professional mental health
      counselors, blind rehabilitation specialists, blind rehabilitation
      outpatient specialists, statisticians, economists, informaticists, data
      scientists" -- the last four professions (statisticians, economists,
      informaticists, data scientists) are the VIPER Act's Dec 2022 addition,
      appended immediately before the statute's catch-all clause; everything
      before them in the list reads as the pre-existing enumeration and is
      treated as such here. See va_title38_hybrid_viper for the dated split.

      Series matched: psychologists (0180), social workers (0185), general
      health science (0601), dietitians (0630), occupational therapists (0631),
      physical therapists (0633), pharmacists (0660), speech pathologists/
      audiologists (0665), biomedical engineers (0858), practical/vocational
      nurses (0620), nurse assistants (0621), diagnostic radiologic
      technologists (0647), and medical technologists (0644). NOT MATCHED, for
      lack of a verified OPM series code (not for lack of legal basis -- the
      profession IS named in the statute): hearing aid specialists, respiratory
      therapists, medical instrument technicians, medical records
      administrators/specialists/technicians, dental hygienists/assistants,
      nuclear medicine technologists, occupational therapy assistants,
      kinesiotherapists, orthotist-prosthetists, pharmacy technicians, physical
      therapy assistants, prosthetic representatives, marriage/family therapists,
      licensed professional mental health counselors, blind rehabilitation
      specialists/outpatient specialists. Guessing codes for these risked
      corrupting the crosswalk, so they were left out rather than guessed. Their
      individual addition dates within the statute's amendment history were not
      independently researched -- all are treated as in effect for the full
      accessions window (2005-present), which is safe unless any of them were
      individually added to 7401(3) after 2005, which was not checked.
    sql_predicate: >
      substr(agency_code,1,2)='VA'
      AND occupational_series_code IN
        ('0180','0185','0601','0630','0631','0633','0660','0665','0858',
         '0620','0621','0647','0644')
      AND position_occupied='EXCEPTED SERVICE'

  - id: va_title38_hybrid_viper
    label: "VA hybrid title 38, VIPER Act additions (38 USC 7401(3))"
    plain_label: "VA medical staff added by the VIPER Act"
    confidence: confirmed
    legal_basis: "38 U.S.C. 7401(3), as amended by the VIPER Act of 2021 (Pub. L. 117-328, Dec 2022)"
    eligible_from: "2022-12"
    sources:
      - {cite: "38 U.S.C. 7401(3), current text", url: "https://www.law.cornell.edu/uscode/text/38/7401", verified: primary_text_read}
      - {cite: "VIPER Act of 2021 (Pub. L. 117-328, Dec 2022) -- added statisticians/economists/informaticists/data scientists to 7401(3)",
         url: "https://www.congress.gov/bill/117th-congress/house-bill/5721/text", verified: primary_doc_quoted_in_secondary}
    preference_status: exempt_from_302
