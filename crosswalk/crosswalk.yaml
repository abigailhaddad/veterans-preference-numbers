        verified: primary_text_read
    preference_status: applies_full
    notes: "Same VRA caveat as ordinary_competitive_permanent above."
    sql_predicate: "position_occupied = 'COMPETITIVE SERVICE'"

  - id: other_excepted_unidentified
    label: "Other excepted service, authority unidentified"
    plain_label: "Other excepted service, authority unidentified"
    confidence: residual
    legal_basis: null
    sources: []
    preference_status: unknown
    notes: >
      Catch-all -- DO NOT treat as exempt_from_302. Per 5 CFR 302.101(c), agencies
      filling excepted positions not otherwise covered by Part 302 must follow
      preference "as far as administratively feasible," which would make this
      exempt-from-302-like IF that were the only authority in play -- but this
      bucket almost certainly also contains VEOA, DHS CTMS, and other named
      statutory authorities (some of which apply FULL preference, e.g. VEOA)
      that this crosswalk has no field to detect. (VRA is a competitive-service
      authority, not excepted service -- see known_gaps.vra_veoa_blind_spot --
      so it hides in the competitive-service buckets, not here.) It is 80%+ of
      everything that would otherwise be tagged exempt_from_302 by hire count,
      so mislabeling it there would badly overstate confidence in any
      preference_status rollup. Genuinely unknown.
    sql_predicate: "TRUE"  # fallback / else clause

# =============================================================================
# DHA authorities: government-wide + DoD-specific direct-hire authorities, by
# occupational series and grade (+ agency, for DoD-specific ones). See the file
# header above for how this section is used alongside `regimes`.
#
# DHA waives 5 U.S.C. 3309-3318 (points, ranking, rule of three) for the covered
# competitive-service appointments. It does NOT change service type, pay plan, or
# appointment type -- a DHA hire is recorded identically to an ordinary competitive
# appointment in the public EHRI accessions data. This section makes DHA-eligibility
# (not DHA-usage) explicit and joinable against accessions by series + grade + date,
# so it can be cross-tabulated against the `regimes` buckets above rather than
# silently hidden inside them.
#
# IMPORTANT: eligible =/= used. An agency may have a DHA-eligible position and still
# fill it through ordinary delegated examining. This section establishes the ceiling
# on how much of a bucket COULD have bypassed mechanical preference, not how much did.
# Every government-wide source memo states explicitly that veterans' preference
# eligibles should still be selected as found among the qualified pool -- DHA removes
# RANKING, not preference consideration. See dha_notes_on_preference_under_dha below.
#
# Top-level `source` on each authority below is the primary document; per-series
# `note` fields add anything specific to that series. All were fetched and read
# directly (verified: primary_text_read at the authority level) except where noted.
# =============================================================================

